<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Access Codes · Calas Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#F1F6F9;--card:#fff;--ink:#12212C;--ink2:#4E5B66;--rule:#D9E3EA;--blue:#155F87;--night:#0B2E45;--ok:#17794A;--okbg:#E9F5EE;--bad:#A3352B;--badbg:#FBECEA;--mid:#8A6100;--midbg:#FFF4DA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0B1A26;--card:#102434;--ink:#EEF4F8;--ink2:#B4C4CF;--rule:#1F3A4D;--blue:#4FA3D1;--ok:#6FD9A2;--okbg:#16302A;--bad:#FF9C8F;--badbg:#3A1C19;--mid:#F2C465;--midbg:#352A10}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--night);color:#fff;padding:14px 16px}header .w{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
header b{font:700 18px "Libre Baskerville",Georgia,serif}header button{width:auto;margin:0;background:transparent;border:1px solid #1E4A66;color:#B9CFDD;padding:6px 12px}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px;margin-bottom:16px}
h1,h2{font-family:"Libre Baskerville",Georgia,serif;margin:0 0 10px}h1{font-size:22px}h2{font-size:18px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 4px}
input,select{width:100%;font:inherit;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
button{font:600 15px "IBM Plex Sans",sans-serif;padding:11px 16px;border:0;border-radius:8px;background:var(--blue);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--blue);border:1px solid var(--rule);padding:6px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}.check input{width:auto}
.notice{padding:10px 12px;border-radius:8px;margin:0 0 12px;font-size:14px}.warn{background:var(--midbg);color:var(--mid)}.good{background:var(--okbg);color:var(--ok)}.err{background:var(--badbg);color:var(--bad)}
.made{font:500 18px "IBM Plex Mono",monospace;letter-spacing:1px}
.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--rule);white-space:nowrap}th{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
td.code{font-family:"IBM Plex Mono",monospace}.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.on{background:var(--okbg);color:var(--ok)}.off{background:var(--badbg);color:var(--bad)}.soon{background:var(--midbg);color:var(--mid)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters select,.filters input{width:auto;min-width:150px}
#login{max-width:380px;margin:60px auto}
</style>
</head><body>
<header><div class="w"><b>Calas · Access codes</b><button id="out" hidden>Sign out</button></div></header>
<main>
  <section id="login" class="card">
    <h1>Owner sign-in</h1>
    <p style="color:var(--ink2);margin-top:0">Only for Dan. Enter the admin password you set.</p>
    <form id="lf"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password">
    <button style="margin-top:12px;width:100%">Sign in</button></form>
    <div id="lmsg" class="notice err" hidden></div>
  </section>

  <div id="app" hidden>
    <div id="setup"></div>
    <section class="card">
      <h1>Make a free access code</h1>
      <form id="cf">
        <div class="grid">
          <div><label for="app-sel">App</label><select id="app-sel"></select></div>
          <div><label for="exp">Works until (end of this day)</label><input id="exp" type="date" required></div>
          <div><label for="note">Who is it for?</label><input id="note" placeholder="e.g. Dan Pratt"></div>
          <div><label for="email">Their email (optional)</label><input id="email" type="email" placeholder="friend@example.com"></div>
          <div><label for="count">How many codes</label><input id="count" type="number" min="1" max="500" value="1"></div>
        </div>
        <label class="check"><input type="checkbox" id="send"> Email the code to them now</label>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button>Make code</button>
          <button type="button" class="ghost" data-days="14">2 weeks</button>
          <button type="button" class="ghost" data-days="30">1 month</button>
          <button type="button" class="ghost" data-days="90">3 months</button>
        </div>
      </form>
      <div id="madebox" style="margin-top:14px"></div>
    </section>

    <section class="card">
      <h2>All codes</h2>
      <div class="filters">
        <select id="f-app"><option value="">Every app</option></select>
        <select id="f-status"><option value="">Every status</option><option value="live">Working</option><option value="dead">Ended / turned off</option></select>
        <input id="f-q" placeholder="Search name, email, code">
      </div>
      <div class="tablewrap"><table><thead><tr><th>Code</th><th>App</th><th>For</th><th>Status</th><th>Works until</th><th>Type</th><th>Last used</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>

    <section class="card">
      <h2>Dispatch Me requests</h2>
      <div class="tablewrap"><table><thead><tr><th>When</th><th>Type</th><th>Who</th><th>Contact</th><th>Where / size</th><th>Notes</th><th>Status</th></tr></thead><tbody id="lrows"></tbody></table></div>
    </section>
  </div>
</main>
<script>
(function(){
  var API='https://calas-access.calasdan.workers.dev', PW='', DATA=null;
  var $=function(s){return document.querySelector(s)};
  function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
  function call(path,body){return fetch(API+path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+PW,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(d){d._status=r.status;return d})})}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function day(ms){return ms?new Date(ms).toLocaleDateString('en-CA',{timeZone:'America/Winnipeg',year:'numeric',month:'short',day:'numeric'}):'—'}
  function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
  function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}

  function login(pw){PW=pw;return call('/api/admin/login',{}).then(function(d){
    if(!d.ok){$('#lmsg').hidden=false;$('#lmsg').textContent=d._status===401?'That password didn’t work.':'Couldn’t reach the server.';ss('cpw',null);return}
    ss('cpw',pw);$('#login').hidden=true;$('#app').hidden=false;$('#out').hidden=false;load()}).catch(function(){$('#lmsg').hidden=false;$('#lmsg').textContent='Couldn’t reach the server.'})}
  $('#lf').addEventListener('submit',function(e){e.preventDefault();login($('#pw').value)});
  $('#out').addEventListener('click',function(){ss('cpw',null);location.reload()});

  function loadLeads(){call('/api/admin/leads').then(function(d){if(!d.ok)return;var h='';
    d.leads.forEach(function(l){h+='<tr><td>'+day(l.created_at)+'</td><td>'+(l.kind==='crew'?'Crew wants in':'Needs clearing')+'</td><td>'+esc(l.name)+'<br><small>'+esc(l.company)+'</small></td><td>'+esc(l.phone)+'<br><small>'+esc(l.email)+'</small></td><td style="white-space:normal;min-width:180px">'+esc(l.area)+'<br><small>'+esc(l.size)+'</small></td><td style="white-space:normal;min-width:200px">'+esc(l.notes)+'</td><td><select data-lead="'+l.id+'">'+['new','contacted','signed','no'].map(function(s){return'<option'+(s===l.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'});
    $('#lrows').innerHTML=h||'<tr><td colspan="7" style="color:var(--ink2)">No requests yet.</td></tr>'})}
  $('#lrows').addEventListener('change',function(e){var id=e.target.getAttribute('data-lead');if(id)call('/api/admin/leads/'+id+'/status',{status:e.target.value})});

  function load(){loadLeads();call('/api/admin/codes').then(function(d){
    DATA=d;var sel=$('#app-sel'),fa=$('#f-app');
    if(!sel.options.length){Object.keys(d.apps).forEach(function(k){sel.add(new Option(d.apps[k],k));fa.add(new Option(d.apps[k],k))});sel.value='leadme'}
    var s='';
    if(!d.email_ready)s+='<div class="notice warn">Email sending isn’t switched on yet, so codes are shown here for you to copy and send yourself.</div>';
    if(!d.stripe_ready)s+='<div class="notice warn">Stripe isn’t connected yet, so paying customers won’t get codes automatically until it is.</div>';
    $('#setup').innerHTML=s;render()})}

  function render(){
    if(!DATA)return;var fa=$('#f-app').value,fs=$('#f-status').value,q=$('#f-q').value.toLowerCase(),now=Date.now(),h='';
    DATA.codes.forEach(function(c){
      if(fa&&c.app!==fa)return;if(fs==='live'&&!c.live)return;if(fs==='dead'&&c.live)return;
      if(q&&(c.code+' '+c.note+' '+c.email).toLowerCase().indexOf(q)<0)return;
      var soon=c.live&&c.expires_at-now<7*864e5;
      var st=c.status==='revoked'?'<span class="pill off">Turned off</span>':!c.live?'<span class="pill off">Ended</span>':soon?'<span class="pill soon">Ends soon</span>':'<span class="pill on">Working</span>';
      h+='<tr><td class="code">'+esc(c.code)+'</td><td>'+esc(DATA.apps[c.app]||c.app)+'</td><td>'+esc(c.note)+(c.email?'<br><small>'+esc(c.email)+'</small>':'')+'</td><td>'+st+'</td><td>'+day(c.expires_at)+'</td><td>'+(c.source==='stripe'?'Paid':'Free')+'</td><td>'+(c.last_used_at?day(c.last_used_at):'Never')+'</td><td>'+
        '<button class="ghost" data-a="copy" data-c="'+esc(c.code)+'">Copy</button> '+
        (c.status==='revoked'?'<button class="ghost" data-a="restore" data-c="'+esc(c.code)+'">Turn on</button> ':'<button class="ghost" data-a="revoke" data-c="'+esc(c.code)+'">Turn off</button> ')+
        (c.source==='admin'?'<button class="ghost" data-a="extend" data-c="'+esc(c.code)+'">Change date</button> ':'')+
        '<button class="ghost" data-a="email" data-c="'+esc(c.code)+'" data-e="'+esc(c.email)+'">Email</button></td></tr>'});
    $('#rows').innerHTML=h||'<tr><td colspan="8" style="color:var(--ink2)">No codes yet.</td></tr>'}
  ['#f-app','#f-status','#f-q'].forEach(function(s){$(s).addEventListener('input',render)});

  $('#rows').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var c=b.getAttribute('data-c'),a=b.getAttribute('data-a');
    if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(c);b.textContent='Copied';return}
    if(a==='revoke'&&!confirm('Turn off '+c+'? It stops working right away.'))return;
    var body={};
    if(a==='extend'){var d=prompt('New end date (YYYY-MM-DD):',plus(30));if(!d)return;body.expires=d}
    if(a==='email'){var em=prompt('Email the code to:',b.getAttribute('data-e')||'');if(!em)return;body.email=em}
    call('/api/admin/codes/'+encodeURIComponent(c)+'/'+a,body).then(function(d){if(!d.ok)alert(d.error==='email_not_sent'?'Email didn’t send. Is email switched on?':'That didn’t work: '+(d.error||'unknown'));load()})});

  document.querySelectorAll('[data-days]').forEach(function(b){b.addEventListener('click',function(){$('#exp').value=plus(+b.getAttribute('data-days'))})});
  $('#exp').value=plus(14);

  $('#cf').addEventListener('submit',function(e){e.preventDefault();
    call('/api/admin/codes',{app:$('#app-sel').value,expires:$('#exp').value,note:$('#note').value,email:$('#email').value,count:$('#count').value,send_email:$('#send').checked}).then(function(d){
      if(!d.ok){$('#madebox').innerHTML='<div class="notice err">'+({pick_an_end_date:'Pick an end date.',end_date_in_past:'That date has already passed.',pick_an_app:'Pick an app.'}[d.error]||'Something went wrong.')+'</div>';return}
      $('#madebox').innerHTML='<div class="notice good">Made. Works until '+day(d.expires_at)+'.</div>'+d.made.map(function(m){return'<div class="made">'+esc(m.code)+(m.emailed?' <small style="font-family:IBM Plex Sans">(emailed)</small>':'')+'</div>'}).join('');
      load()})});

  var saved=ss('cpw');if(saved)login(saved);
})();
</script>
</body></html>
